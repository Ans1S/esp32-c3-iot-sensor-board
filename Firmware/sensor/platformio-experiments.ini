[platformio]
extra_configs = platformio.ini

# Separate images for measurement; normal upload.py targets remain unchanged.
[env:sensor_pcb_v3_o2]
extends = env:sensor_pcb_v3
build_unflags = ${env.build_unflags} -Os
build_flags = ${env:sensor_pcb_v3.build_flags} -O2

[env:sensor_pcb_v3_160mhz]
extends = env:sensor_pcb_v3
board_build.f_cpu = 160000000L

[env:sensor_pcb_v3_lto]
extends = env:sensor_pcb_v3
build_unflags = ${env.build_unflags} -fno-lto
build_flags = ${env:sensor_pcb_v3.build_flags} -flto

[env:sensor_pcb_v4_storage]
extends = env:sensor_pcb_v4
build_flags =
    ${env:sensor_pcb_v4.build_flags}
    -DSENSOR_STORAGE_DISCOVERY_MAX_SECONDS=3600

# Compile coverage only: determine the threshold from the fitted cell before use.
[env:sensor_pcb_v4_guard]
extends = env:sensor_pcb_v4
build_flags =
    ${env:sensor_pcb_v4.build_flags}
    -DSENSOR_LOW_BATTERY_PAUSE_MV=3000
