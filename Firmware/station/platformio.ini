[platformio]
default_envs = station_s3

[env:station_s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
# A USB upload is treated as a fresh installation. This also erases the NVS
# partition so stale WLAN, cloud and sensor settings cannot survive flashing.
extra_scripts = post:fresh_upload.py
lib_deps =
    bblanchon/ArduinoJson @ 7.4.3
    lil-sensor-protocol=symlink://../shared
build_flags =
    -std=gnu++17
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -Wall
    -Wextra
    -Wno-unused-parameter
    -DARDUINO_LITTLEFS_MAX_PARTITIONS=1
build_unflags = -std=gnu++11
board_build.partitions = default_8MB.csv
