[platformio]
default_envs = station_s3

[env:station_s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
# Normal USB uploads preserve NVS settings and the LittleFS recording archive.
extra_scripts =
    pre:../shared/scripts/public_build_paths.py
    post:fresh_upload.py
lib_deps =
    bblanchon/ArduinoJson @ 7.4.3
    lil-sensor-protocol=symlink://../shared
build_flags =
    -std=gnu++17
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -Wall
    -Wextra
    -Wno-unused-parameter
    -DARDUINO_LITTLEFS_MAX_PARTITIONS=1
build_unflags = -std=gnu++11
board_build.partitions = partitions_ota.csv

[env:station_s3_factory_reset]
extends = env:station_s3
custom_erase_all = true
