<svg xmlns="http://www.w3.org/2000/svg" width="840" height="520" viewBox="0 0 840 520">
<title>Sensors, station and browser connected in one system</title>
<rect width="840" height="520" rx="24" fill="#edf5f0"/>
<g font-family="Arial, sans-serif">
<text x="32" y="49" fill="#172b20" font-size="27" font-weight="700">One station. Every sensor.</text>
<rect x="32" y="82" width="340" height="224" rx="18" fill="#fff"/>
<g x="56" fill="#172b20"><text x="56" y="122" font-size="25" font-weight="700">Your sensor nodes</text>
<text x="56" y="170" font-size="22">Climate · BME280 / BME680</text><text x="56" y="213" font-size="22">Motion · LSM6DSOX</text><text x="56" y="256" font-size="22">More sensors in development</text></g>
<rect x="500" y="82" width="308" height="224" rx="18" fill="#146c43"/>
<text x="654" y="162" text-anchor="middle" fill="#fff" font-size="32" font-weight="700">W-Charger</text><text x="654" y="203" text-anchor="middle" fill="#fff" font-size="24">ESP32-S3 station</text><text x="654" y="257" text-anchor="middle" fill="#e4f4ea" font-size="21">Receive · store · update</text>
<path d="M384 200h102m-10-8 10 8-10 8" fill="none" stroke="#146c43" stroke-width="3"/>
<text x="436" y="180" text-anchor="middle" fill="#146c43" font-size="19">ESP-NOW</text>
<path d="M654 310v30m-8-10 8 10 8-10" fill="none" stroke="#146c43" stroke-width="3"/>
<rect x="32" y="350" width="776" height="138" rx="18" fill="#fff"/>
<text x="56" y="390" fill="#172b20" font-size="26" font-weight="700">Open your browser</text>
<text x="56" y="430" fill="#455c4e" font-size="22">Readings and history · Sensor settings · Signed OTA updates</text>
<text x="56" y="464" fill="#455c4e" font-size="21">Works locally. Optional ThingSpeak export.</text>
</g></svg>
