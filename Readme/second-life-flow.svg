<svg xmlns="http://www.w3.org/2000/svg" width="840" height="440" viewBox="0 0 840 440">
<title>A second life for a rechargeable cell</title>
<rect width="840" height="440" rx="24" fill="#edf5f0"/>
<g font-family="Arial, sans-serif" fill="#172b20">
<text x="32" y="49" font-size="27" font-weight="700">A second life for stored energy</text>
<g transform="translate(32 78)"><rect width="370" height="140" rx="16" fill="white"/><text x="22" y="37" font-size="22" fill="#167047" font-weight="700">01</text><text x="22" y="76" font-size="25" font-weight="700">Disposable vape</text><text x="22" y="111" font-size="21" fill="#455c4e">Short-lived device.</text></g><g transform="translate(438 78)"><rect width="370" height="140" rx="16" fill="white"/><text x="22" y="37" font-size="22" fill="#167047" font-weight="700">02</text><text x="22" y="76" font-size="25" font-weight="700">Rechargeable cell</text><text x="22" y="111" font-size="21" fill="#455c4e">Recover and check safely.</text></g><g transform="translate(32 250)"><rect width="370" height="140" rx="16" fill="white"/><text x="22" y="37" font-size="22" fill="#167047" font-weight="700">03</text><text x="22" y="76" font-size="25" font-weight="700">Low-power sensor</text><text x="22" y="111" font-size="21" fill="#455c4e">Measure. Report. Sleep.</text></g><g transform="translate(438 250)"><rect width="370" height="140" rx="16" fill="white"/><text x="22" y="37" font-size="22" fill="#167047" font-weight="700">04</text><text x="22" y="76" font-size="25" font-weight="700">Useful measurements</text><text x="22" y="111" font-size="21" fill="#455c4e">Read them on the station.</text></g>
</g><g stroke="#167047" stroke-width="3" fill="none"><path d="M407 148h23m-8-7 8 7-8 7M407 320h23m-8-7 8 7-8 7"/></g>
